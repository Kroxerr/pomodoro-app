<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pomodoro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @font-face { font-family: "Doto"; src: url("fonts/doto-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Doto"; src: url("fonts/doto-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-display: block; }
</style>
<style>
  :root {
    --page: #000000;
    --pill: #000000;
    --red: #D71921;
    --fg: #FFFFFF;
    --muted: rgba(255,255,255,0.5);
    --edge: rgba(255,255,255,0.16);
    --grain: rgba(255,255,255,0.07);
    --font: "Doto", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #000000; --pill: #000000; }
  }
  :root[data-theme="dark"] { --page: #000000; --pill: #000000; }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--page);
    color: var(--fg);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  .pill {
    position: relative;
    height: min(72vh, 176vw, 600px);
    aspect-ratio: 9 / 20;
    border-radius: 9999px;
    border: 1px solid var(--edge);
    background: var(--pill);
    overflow: hidden;
    isolation: isolate;
    -webkit-mask-image: -webkit-radial-gradient(white, black);
    container-type: size;
    cursor: pointer;
    padding: 0;
    color: inherit;
    font: inherit;
    touch-action: manipulation;
  }
  .pill:focus-visible { outline: 2px solid var(--fg); outline-offset: 6px; }

  .fill {
    position: absolute;
    inset: 0;
    background: var(--red);
    transform-origin: 50% 100%;
    transform: scaleY(0);
    will-change: transform;
    z-index: 0;
  }

  /* dot-matrix texture over everything, like the Glyph grid */
  .pill::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, var(--grain) 1px, transparent 1.6px);
    background-size: 8px 8px;
    pointer-events: none;
    z-index: 1;
  }

  .face {
    position: relative;
    z-index: 2;
    height: 100%;
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    justify-items: center;
    align-items: center;
    padding: 18cqw 0;
  }

  .status {
    align-self: start;
    display: flex;
    align-items: center;
    gap: 3cqw;
    font-size: 8cqw;
    font-weight: 900;
    letter-spacing: 0.04em;
    padding-left: 0.1em;
  }
  .rec {
    width: 3.4cqw; height: 3.4cqw;
    border-radius: 50%;
    background: var(--red);
  }
  body[data-state="idle"] .rec { animation: blink 1.4s steps(1) infinite; }
  body[data-state="focus"] .rec,
  body[data-state="grow"] .rec { background: var(--fg); }
  body[data-state="break"] .rec { background: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }

  .digits {
    font-size: 46cqw;
    font-weight: 900;
    line-height: 0.86;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  /* Doto's digits carry 0.1em more space on the right than the left
     (lsb 5 / rsb 105 units), so the ink sits 0.05em left of centre.
     Shift it back so the numbers are optically centred. */
  .digits span { display: block; transform: translateX(0.05em); }

  .foot {
    align-self: end;
    display: grid;
    justify-items: center;
    gap: 5cqw;
  }
  .hint {
    font-size: 7cqw;
    font-weight: 500;
    color: var(--muted);
    padding-left: 0.1em;
  }
  body[data-state="focus"] .hint,
  body[data-state="grow"] .hint { color: rgba(255,255,255,0.75); }

  .sessions { display: flex; gap: 3cqw; min-height: 3cqw; }
  .sessions i {
    width: 3cqw; height: 3cqw;
    border-radius: 50%;
    background: var(--fg);
  }

  .settings { position: relative; }
  .menu-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid var(--edge);
    background: var(--pill);
    color: var(--fg);
    display: grid; place-items: center;
    cursor: pointer;
    padding: 0;
  }
  .menu-btn .dots { display: flex; gap: 4px; }
  .menu-btn .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--fg); }
  .menu-btn[aria-expanded="true"] .dots i:nth-child(2) { background: var(--red); }
  .menu-btn:focus-visible, .toggle:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  .menu {
    position: absolute;
    bottom: calc(100% + 12px);
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    padding: 6px;
    border-radius: 28px;
    border: 1px solid var(--edge);
    background: var(--pill);
    display: grid;
    gap: 2px;
    z-index: 10;
  }
  .menu[hidden] { display: none; }
  .toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 12px 12px 12px 16px;
    border: 0;
    border-radius: 22px;
    background: transparent;
    color: var(--fg);
    font: 900 17px/1 var(--font);
    cursor: pointer;
    text-align: left;
  }
  .toggle:hover { background: rgba(255,255,255,0.06); }
  .switch {
    position: relative;
    width: 42px; height: 24px;
    border-radius: 12px;
    border: 1px solid var(--edge);
    background: transparent;
    transition: background-color .2s ease, border-color .2s ease;
    flex: none;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 50%; left: 4px;
    width: 14px; height: 14px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform .2s ease, background-color .2s ease;
  }
  .toggle[aria-checked="true"] .switch { background: var(--red); border-color: var(--red); }
  .toggle[aria-checked="true"] .switch::after { transform: translateX(18px); background: var(--fg); }

  .tones {
    display: grid;
    gap: 2px;
    margin: 0 6px 4px;
    padding: 4px 0;
    border-top: 1px solid var(--edge);
    border-bottom: 1px solid var(--edge);
    transition: opacity .2s ease;
  }
  .tones[aria-disabled="true"] { opacity: 0.3; pointer-events: none; }
  .tone {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 9px 12px 9px 10px;
    border: 0;
    border-radius: 18px;
    background: transparent;
    color: var(--muted);
    font: 500 16px/1 var(--font);
    cursor: pointer;
  }
  .tone:hover { background: rgba(255,255,255,0.06); }
  .tone:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .tone[aria-checked="true"] { color: var(--fg); font-weight: 900; }
  .pick {
    width: 10px; height: 10px;
    margin-right: 16px;
    border-radius: 50%;
    border: 1px solid var(--edge);
  }
  .tone[aria-checked="true"] .pick { background: var(--red); border-color: var(--red); }

  @media (prefers-reduced-motion: reduce) {
    .tones { transition: none; }
    .switch, .switch::after { transition: none; }
    body[data-state="idle"] .rec { animation: none; }
  }
</style>
</head>
<body data-state="idle">

<button class="pill" id="pill" aria-label="Start pomodoro">
  <div class="fill" id="fill"></div>
  <div class="face">
    <div class="status"><span class="rec"></span><span id="label">Ready</span></div>
    <div class="digits" aria-live="off"><span id="mm">25</span><span id="ss">00</span></div>
    <div class="foot">
      <div class="sessions" id="sessions" aria-hidden="true"></div>
      <div class="hint" id="hint">Tap to start</div>
    </div>
  </div>
</button>

<div class="settings">
  <div class="menu" id="menu" hidden>
    <button class="toggle" role="switch" id="t-sound" aria-checked="true">Sound<span class="switch"></span></button>
    <div class="tones" id="tones" role="radiogroup" aria-label="Alarm sound">
      <button class="tone" role="radio" data-tone="dots">Dots<span class="pick"></span></button>
      <button class="tone" role="radio" data-tone="chime">Chime<span class="pick"></span></button>
      <button class="tone" role="radio" data-tone="rise">Rise<span class="pick"></span></button>
      <button class="tone" role="radio" data-tone="soft">Soft<span class="pick"></span></button>
      <button class="tone" role="radio" data-tone="loud">Loud<span class="pick"></span></button>
    </div>
    <button class="toggle" role="switch" id="t-vibrate" aria-checked="true">Vibration<span class="switch"></span></button>
    <button class="toggle" role="switch" id="t-awake" aria-checked="true">Screen on<span class="switch"></span></button>
  </div>
  <button class="menu-btn" id="menuBtn" aria-label="Settings" aria-expanded="false" aria-controls="menu">
    <span class="dots"><i></i><i></i><i></i></span>
  </button>
</div>

<script>
(() => {
  const FOCUS = 25 * 60 * 1000;
  const BREAK = 5 * 60 * 1000;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const GROW = reduced ? 200 : 800;

  const $ = id => document.getElementById(id);
  const pill = $("pill"), fill = $("fill"), mm = $("mm"), ss = $("ss");
  const label = $("label"), hint = $("hint"), sessionsEl = $("sessions");

  let state = "idle";   // idle | grow | focus | break
  let phaseStart = 0, phaseEnd = 0, sessions = 0, raf = 0, wakeLock = null, audio = null;
  let currentLevel = 0, growFrom = 0, drainRaf = 0;
  const DRAIN = reduced ? 150 : 900;

  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  function setLevel(v) {
    currentLevel = v;
    fill.style.transform = `scaleY(${v})`;
  }

  function setState(s) {
    state = s;
    document.body.dataset.state = s;
    label.textContent = { idle: "Ready", grow: "Focus", focus: "Focus", break: "Break" }[s];
    hint.textContent = s === "idle" ? "Tap to start" : "Tap to stop";
    pill.setAttribute("aria-label", s === "idle" ? "Start pomodoro" : "Stop pomodoro");
  }

  function renderSessions() {
    const n = Math.min(sessions, 8);
    sessionsEl.innerHTML = "<i></i>".repeat(n);
  }

  function showTime(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = String(Math.floor(total / 60)).padStart(2, "0");
    const s = String(total % 60).padStart(2, "0");
    if (mm.textContent !== m) mm.textContent = m;
    if (ss.textContent !== s) ss.textContent = s;
    document.title = state === "idle" ? "Pomodoro" : `${m}:${s} · ${label.textContent}`;
  }

  // Advance through phases based on wall-clock time (survives background tabs)
  function advance(now) {
    let changed = false, lastAt = 0;
    for (;;) {
      if (state === "grow" && now >= phaseEnd) {
        const s = phaseEnd;
        setState("focus"); phaseStart = s; phaseEnd = s + FOCUS;
      } else if (state === "focus" && now >= phaseEnd) {
        const s = phaseEnd;
        sessions++; renderSessions();
        setState("break"); phaseStart = s; phaseEnd = s + BREAK;
        changed = true; lastAt = s;
      } else if (state === "break" && now >= phaseEnd) {
        const s = phaseEnd;
        setState("grow"); phaseStart = s; phaseEnd = s + GROW; growFrom = 0;
        changed = true; lastAt = s;
      } else break;
    }
    if (changed) {
      const alreadyPlayed = armed.at === lastAt && audio && audio.state === "running";
      armed.at = 0;
      signal(!alreadyPlayed);
      armAlarm();
    }
  }

  function render() {
    const now = Date.now();
    advance(now);
    let level = 0;
    if (state === "grow") {
      level = growFrom + (1 - growFrom) * easeOut(Math.min(1, (now - phaseStart) / GROW));
      showTime(FOCUS);
    } else if (state === "focus") {
      const left = phaseEnd - now;
      level = Math.max(0, left / FOCUS);
      showTime(left);
    } else if (state === "break") {
      showTime(phaseEnd - now);
    }
    setLevel(level);
    if (state !== "idle") raf = requestAnimationFrame(render);
  }

  function start() {
    unlockAudio();
    sessions = 0; renderSessions();
    cancelAnimationFrame(drainRaf);
    growFrom = currentLevel;
    const now = Date.now();
    setState("grow"); phaseStart = now; phaseEnd = now + GROW;
    armAlarm();
    syncWake(true);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(render);
  }

  function stop() {
    cancelAnimationFrame(raf);
    setState("idle");
    disarm();
    sessions = 0; renderSessions();
    showTime(FOCUS);
    syncWake(true);

    const from = currentLevel;
    if (from <= 0) return;
    const t0 = performance.now();
    const drain = t => {
      const p = Math.min(1, (t - t0) / DRAIN);
      setLevel(from * (1 - easeInOut(p)));
      if (p < 1) drainRaf = requestAnimationFrame(drain);
    };
    cancelAnimationFrame(drainRaf);
    drainRaf = requestAnimationFrame(drain);
  }

  pill.addEventListener("click", () => (state === "idle" ? start() : stop()));

  setInterval(() => { if (state !== "idle" && document.hidden) render(); }, 1000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && state !== "idle") {
      unlockAudio();
      armAlarm();
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(render);
    }

      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();

    if (state === "focus" || state === "break") return phaseEnd;
    return 0;
  }

  const TONES = {
    dots:  t => { for (let i = 0; i < 3; i++) note(1320, t + i * 0.16, 0.09, "square", 0.08); },
    chime: t => { note(880, t, 1.1, "sine", 0.35); note(1320, t + 0.28, 1.4, "sine", 0.3); note(2640, t + 0.28, 0.6, "sine", 0.05); },
    rise:  t => { [660, 880, 1100, 1320].forEach((f, i) => note(f, t + i * 0.09, 0.12, "triangle", 0.25)); },
    soft:  t => { note(440, t, 0.5, "sine", 0.14); note(440, t + 0.6, 0.5, "sine", 0.14); },
    loud:  t => { for (let r = 0; r < 3; r++) for (let i = 0; i < 4; i++) note(2000, t + r * 0.7 + i * 0.11, 0.07, "square", 0.22); }
  };
  function playTone(name) {
    if (!audio) return;
    try { (TONES[name] || TONES.dots)(audio.currentTime + 0.02); } catch (e) {}
  }

  // keep the phone screen from dimming or turning off.
  // Native Screen Wake Lock first; on phones without it (older iOS, some
  // home-screen apps) fall back to NoSleep's silent looping video, which
  // needs a tap to start.
  const noSleep = window.NoSleep ? new NoSleep() : null;
  let noSleepOn = false, wakePending = false;
  const wantAwake = () => prefs.awake || state !== "idle";

  async function acquireWake(fromGesture) {
    if (wakeLock || noSleepOn || wakePending || document.hidden) return;
    if ("wakeLock" in navigator) {
      wakePending = true;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
        return;
      } catch (e) { wakeLock = null; }
      finally { wakePending = false; }
    }
    if (fromGesture && noSleep) {
      try { await noSleep.enable(); noSleepOn = true; } catch (e) { noSleepOn = false; }
    }
  }
  function releaseWake() {
    try { wakeLock && wakeLock.release(); } catch (e) {}
    wakeLock = null;
    if (noSleepOn) { try { noSleep.disable(); } catch (e) {} noSleepOn = false; }
  }
  function syncWake(fromGesture) {
    if (wantAwake()) acquireWake(fromGesture); else releaseWake();
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (noSleepOn) { try { noSleep.disable(); } catch (e) {} noSleepOn = false; } }
    else syncWake(false);
  });
  // any tap re-arms the lock if the phone dropped it
  document.addEventListener("pointerdown", () => syncWake(true), { passive: true });

  // settings: sound + vibration, remembered on this device
  const prefs = { sound: true, vibrate: true, tone: "dots", awake: true };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem("pomodoro-prefs") || "{}")); } catch (e) {}
  const menu = $("menu"), menuBtn = $("menuBtn");
  const toggles = { sound: $("t-sound"), vibrate: $("t-vibrate"), awake: $("t-awake") };
  const toneList = $("tones"), toneBtns = [...toneList.querySelectorAll(".tone")];
  if (!TONES[prefs.tone]) prefs.tone = "dots";
  toneBtns.forEach(b => b.addEventListener("click", () => {
    prefs.tone = b.dataset.tone; syncToggles(); savePrefs();
    unlockAudio(); playTone(prefs.tone);
    if (state !== "idle") armAlarm();
  }));

  function syncToggles() {
    for (const k in toggles) toggles[k].setAttribute("aria-checked", String(!!prefs[k]));
    toneList.setAttribute("aria-disabled", String(!prefs.sound));
    toneBtns.forEach(b => {
      const on = b.dataset.tone === prefs.tone;
      b.setAttribute("aria-checked", String(on));
      b.tabIndex = prefs.sound ? 0 : -1;
    });
  }
  function savePrefs() {
    try { localStorage.setItem("pomodoro-prefs", JSON.stringify(prefs)); } catch (e) {}
  }
  function setMenu(open) {
    menu.hidden = !open;
    menuBtn.setAttribute("aria-expanded", String(open));
  }
  menuBtn.addEventListener("click", e => { e.stopPropagation(); setMenu(menu.hidden); });
  menu.addEventListener("click", e => e.stopPropagation());
  document.addEventListener("click", () => setMenu(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

  toggles.sound.addEventListener("click", () => {
    prefs.sound = !prefs.sound; syncToggles(); savePrefs();
    if (prefs.sound) { unlockAudio(); playTone(prefs.tone); }
    if (state !== "idle") armAlarm();
  });
  toggles.vibrate.addEventListener("click", () => {
    prefs.vibrate = !prefs.vibrate; syncToggles(); savePrefs();
    if (prefs.vibrate) buzz(60);
  });
  toggles.awake.addEventListener("click", () => {
    prefs.awake = !prefs.awake; syncToggles(); savePrefs();
    syncWake(true);
  });
  syncToggles();
  syncWake(false);

  showTime(FOCUS);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
